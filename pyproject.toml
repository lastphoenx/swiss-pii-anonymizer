[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-pii-anonymizer"
version = "0.1.0"
description = "PII-Anonymisierung für deutschsprachige Texte (Presidio + Flair-NER) inkl. Schweizer Identifikatoren (AHV-Nr., IBAN, Telefon)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "flair>=0.14",
    "spacy>=3.7",
    "gliner>=0.2.28",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swiss_pii_anonymizer = ["data/*.json"]
